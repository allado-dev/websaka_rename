<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Webサカ Model Helper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 390px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101820;
      color: #eef7fb;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    h2 { font-size: 13px; margin: 16px 0 8px; color: #d7ecf6; }
    .subtitle { font-size: 12px; color: #9fb2bd; margin-bottom: 14px; }
    .note {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.55;
      color: #9fb2bd;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 10px 0;
      font-size: 13px;
      cursor: pointer;
    }
    input { accent-color: #0067c0; }
    fieldset {
      margin: 16px 0 0;
      padding: 10px 12px 12px;
      border: 1px solid #355366;
      border-radius: 6px;
    }
    legend { padding: 0 5px; font-size: 13px; color: #d7ecf6; }
    .color-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      font-size: 12px;
      cursor: pointer;
    }
    input[type="color"] {
      width: 34px;
      height: 28px;
      padding: 1px;
      border: 1px solid #526d7e;
      border-radius: 4px;
      background: #091117;
      cursor: pointer;
    }
    output { width: 56px; color: #9fb2bd; font: 11px ui-monospace, monospace; }
    button {
      width: 100%;
      margin-top: 9px;
      border: 0;
      border-radius: 7px;
      padding: 9px 10px;
      background: #0067c0;
      color: #09202c;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #223746;
      color: #dff6ff;
      border: 1px solid #355366;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #settingsStatus, #devStatus, #diagStatus {
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
      color: #9fb2bd;
    }
    textarea {
      width: 100%;
      height: 190px;
      resize: vertical;
      margin-top: 8px;
      padding: 8px;
      border: 1px solid #355366;
      border-radius: 6px;
      background: #091117;
      color: #dff6ff;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .divider {
      height: 1px;
      margin: 16px -16px 0;
      background: #263b48;
    }
    code { color: #0067c0; }
  </style>
</head>
<body>
  <h1>Webサカ Model Helper</h1>
  <div class="subtitle">Version 1.1.0</div>

  <label class="toggle-row">
    <input id="enabled" type="checkbox" />
    モデル選手名を実在名で表示（自動コントラスト）
  </label>

  <fieldset>
    <legend>選手名の色設定</legend>
    <label class="color-row" for="lightBgNameColor">
      <span>明るい背景</span>
      <input id="lightBgNameColor" type="color" />
      <output id="lightBgNameColorValue" for="lightBgNameColor"></output>
    </label>
    <label class="color-row" for="darkBgNameColor">
      <span>暗い背景</span>
      <input id="darkBgNameColor" type="color" />
      <output id="darkBgNameColorValue" for="darkBgNameColor"></output>
    </label>
    <button id="resetColors" class="secondary" type="button">色を初期値に戻す</button>
  </fieldset>
  <div id="settingsStatus" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
